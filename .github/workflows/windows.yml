name: Windows

# Every push to main that touches windows/ builds, tests and publishes a numbered release
# (windows-v1.5.<run>). Installed apps check GitHub Releases at launch and every six hours,
# download the new MSI in the background and install it (app/.../platform/Platform.kt, Updater).

on:
  push:
    branches: ["**"]
    tags: ["windows-v*"]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. windows-v1.2.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

env:
  # Bump for a new feature release; every build adds its own number (MSI allows up to 65535).
  BASE_VERSION: "1.5"

defaults:
  run:
    working-directory: windows

jobs:
  test:
    name: Core and CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :cli:installDist --no-daemon
      - name: CLI smoke test
        env:
          SALAH_CONFIG_PATH: ${{ runner.temp }}/salah/config.json
          SALAH_NOW: "2026-09-28T01:00:00+08:00"
        run: |
          S=cli/build/install/salah/bin/salah
          $S --version
          $S location set --lat 1.3521 --lon 103.8198 --tz Asia/Singapore --name Singapore
          $S today --plain
          test "$($S next --compact)" = "Fajr 05:36 (4h 36m)"
          $S schedule --week --json > /dev/null
          set +e; SALAH_CONFIG_PATH=${{ runner.temp }}/none.json $S today; test $? -eq 3

  snapshots:
    name: Design snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:run --args="--snapshot $GITHUB_WORKSPACE/snapshots" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots/*.png

  package:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes come from the commits since the last release
      - name: Version
        id: version
        shell: bash
        run: |
          REF="${{ github.ref }}"
          INPUT="${{ inputs.release_tag }}"
          if [ -n "$INPUT" ]; then TAG="$INPUT"
          elif [[ "$REF" == refs/tags/windows-v* ]]; then TAG="${REF#refs/tags/}"
          else TAG="windows-v$BASE_VERSION.$GITHUB_RUN_NUMBER"; fi
          VERSION="${TAG#windows-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PUBLISH=false
          if [ "${{ github.event_name }}" != "pull_request" ] && { [ "$REF" = "refs/heads/main" ] || [[ "$REF" == refs/tags/windows-v* ]] || [ -n "$INPUT" ]; }; then PUBLISH=true; fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (publish: $PUBLISH)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI and EXE
        run: ./gradlew :core:test :app:packageMsi :app:packageExe :app:createDistributable --no-daemon "-PsalahVersion=${{ steps.version.outputs.version }}"
      - name: Smoke-test the bundled salah command
        shell: cmd
        env:
          SALAH_CONFIG_PATH: ${{ runner.temp }}\salah\config.json
        run: |
          set APPDIR=app\build\compose\binaries\main\app\Salah
          dir /b %APPDIR%\app\resources
          call %APPDIR%\app\resources\salah.cmd --version || exit /b 1
          call %APPDIR%\app\resources\salah.cmd location set --lat 21.4225 --lon 39.8262 --tz Asia/Riyadh --name Mecca || exit /b 1
          call %APPDIR%\app\resources\salah.cmd schedule --week --plain || exit /b 1
      - name: Launch the packaged app (self-test)
        shell: cmd
        env:
          SALAH_CONFIG_PATH: ${{ runner.temp }}\salah-app\config.json
        run: |
          set APPDIR=app\build\compose\binaries\main\app\Salah
          dir /b %APPDIR% %APPDIR%\runtime\bin
          rem Through the real Salah.exe launcher, exactly as the Start menu runs it.
          start "" /wait "%APPDIR%\Salah.exe" --selftest
          set RC=%ERRORLEVEL%
          if exist "%APPDATA%\Salah\crash.log" type "%APPDATA%\Salah\crash.log"
          echo Salah.exe exit code %RC%
          if not "%RC%"=="0" (
            rem Same app on the bundled runtime directly, so the JVM's own error is printed.
            "%APPDIR%\runtime\bin\java.exe" -cp "%APPDIR%\app\*" salah.app.MainKt --selftest
            exit /b 1
          )
      - uses: actions/upload-artifact@v4
        with:
          name: Salah-Windows
          path: |
            windows/app/build/compose/binaries/main/msi/*.msi
            windows/app/build/compose/binaries/main/exe/*.exe
      - name: Release notes
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'windows-v*' HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="-n 15"; fi
          {
            echo "**Salah for Windows**: prayer times, a live countdown, reminders, the Quran player and the \`salah\` command. Installed copies update themselves from here."
            echo
            echo "**Install:** download \`Salah-<version>.exe\` below and run it. If Windows shows \"Windows protected your PC\", choose **More info → Run anyway** (the installer isn't code-signed yet). \`Salah-<version>.msi\` is the same app as a Windows Installer package."
            echo
            echo "Requires Windows 10 or 11 (64-bit). Java is bundled. Setup, features and troubleshooting: see the [README](https://github.com/${{ github.repository }}#readme). Windows edition of [Salah](https://github.com/primayudantra/salah) by Prima Yudantra."
            echo
            echo "### Changes"
            git log $RANGE --no-merges --pretty='- %s' -- . ../.github/workflows/windows.yml
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"
      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Salah for Windows ${{ steps.version.outputs.version }}
          make_latest: true
          body_path: ${{ runner.temp }}/body.md
          files: |
            windows/app/build/compose/binaries/main/msi/*.msi
            windows/app/build/compose/binaries/main/exe/*.exe
